<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пары</title>
<meta name="description" content="Расписание БПИ25-01, СибГУ">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пары">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Цвета: стиль «Ночь», как на карточках S-Work ---------- */
:root{
  --bg:#0B0C10; --surface:#16181F; --surface2:#1D2029; --line:#272B36;
  --text:#F3F4F6; --muted:#9BA1AE; --dim:#6B7180;
  --acc:#3D5CFF; --acc2:#8FA2FF;
  --lec:#8FA2FF; --prac:#4ADE80; --lab:#FBBF24;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font:500 16px/1.35 'Onest',-apple-system,system-ui,sans-serif;min-height:100vh;
  padding:calc(var(--safe-top) + 14px) 16px calc(var(--safe-bot) + 24px);
  background:radial-gradient(120% 60% at 80% -10%,rgba(61,92,255,.22),transparent 60%) var(--bg) no-repeat;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;user-select:none;-webkit-user-select:none}
.wrap{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font:700 22px/1 'Unbounded',sans-serif;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:14px;margin-top:6px}
.gear{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.gear svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}

/* ---------- Карточка «Сейчас / Дальше» ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:18px;
  background:linear-gradient(135deg,#2743F0,#3D5CFF 55%,#6D82FF);box-shadow:0 20px 50px rgba(61,92,255,.28)}
.hero.off{background:var(--surface);border:1px solid var(--line);box-shadow:none}
.hero .lbl{font:700 12px/1 'Onest',-apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero .name{font:700 21px/1.2 'Onest',-apple-system,system-ui,sans-serif;margin:10px 0 6px}
.hero .meta{font-size:15px;opacity:.9}
.hero .big{font:700 34px/1 'Unbounded',-apple-system,system-ui,sans-serif;letter-spacing:-.03em;margin-top:14px}
.hero .big small{font:600 15px 'Onest',-apple-system,system-ui,sans-serif;letter-spacing:0;opacity:.85;margin-left:6px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}

/* ---------- Переключатель недель ---------- */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weekbar .w{font:700 15px 'Onest',-apple-system,system-ui,sans-serif}
.weekbar .w span{color:var(--muted);font-weight:500;margin-left:6px}
.arrows{display:flex;gap:8px}
.arrows button{width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.arrows svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Полоса дней ---------- */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:18px}
.day{border-radius:14px;padding:9px 0 8px;text-align:center;background:var(--surface);border:1px solid var(--line);position:relative}
.day b{display:block;font:700 17px/1 'Unbounded',-apple-system,system-ui,sans-serif;margin-top:5px}
.day em{font-style:normal;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dots{display:flex;justify-content:center;gap:3px;height:5px;margin-top:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--acc2);opacity:.8}
.day.today{border-color:var(--acc2)}
.day.sel{background:var(--acc);border-color:var(--acc)}
.day.sel em{color:#fff;opacity:.8}.day.sel .dots i{background:#fff}
.day.empty b{color:var(--dim)}
.day.sel b{color:#fff}

/* ---------- Список пар ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.les{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.les.now{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.les.past{opacity:.45}
.les .t{font:700 16px/1.15 'Onest',-apple-system,system-ui,sans-serif}
.les .t span{display:block;color:var(--muted);font-weight:500;font-size:14px;margin-top:4px}
.les .t i{display:block;font-style:normal;font:700 11px 'Onest',-apple-system,system-ui,sans-serif;color:var(--dim);margin-top:8px;letter-spacing:.06em}
.les h3{font:700 16px/1.25 'Onest',-apple-system,system-ui,sans-serif;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12px/1 'Onest',-apple-system,system-ui,sans-serif;padding:6px 9px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.tag.Лекция{color:var(--lec);background:rgba(143,162,255,.12)}
.tag.Практика{color:var(--prac);background:rgba(74,222,128,.12)}
.tag.Лаба{color:var(--lab);background:rgba(251,191,36,.12)}
.les .room{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:var(--text)}
.les .room a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--dim)}
.les .who{font-size:14px;color:var(--muted);margin-top:4px}
.gap{text-align:center;font-size:12px;color:var(--dim);margin:-2px 0}
.none{text-align:center;padding:40px 10px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.none b{display:block;font:700 20px 'Unbounded',-apple-system,system-ui,sans-serif;color:var(--text);margin-bottom:6px}

/* ---------- Настройки (нижняя шторка) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#12141A;border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:20px 16px calc(var(--safe-bot) + 22px);transform:translateY(105%);transition:transform .25s,visibility .25s;visibility:hidden}
.open .sheet-bg{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible}
.sheet .in{max-width:520px;margin:0 auto}
.sheet h2{font:700 18px 'Unbounded',-apple-system,system-ui,sans-serif;margin-bottom:16px}
.sheet p{color:var(--muted);font-size:14px;margin:16px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:10px 0;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--acc);color:#fff}
.btn{display:block;width:100%;text-align:center;margin-top:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--text);text-decoration:none}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="group">Пары</h1>
      <div class="sub" id="todayLine"></div>
    </div>
    <button class="gear" id="gear" aria-label="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="hero" id="hero"></section>

  <div class="weekbar">
    <div class="w" id="weekTitle"></div>
    <div class="arrows">
      <button id="prev" aria-label="Прошлая неделя"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="next" aria-label="Следующая неделя"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
  <nav class="days" id="days"></nav>
  <main class="list" id="list"></main>
  <div class="foot" id="foot"></div>
</div>

<div id="sheetRoot">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet"><div class="in">
    <h2>Настройки</h2>
    <p>Моя подгруппа: пары другой подгруппы скроются</p>
    <div class="seg" id="seg">
      <button data-v="0">Обе</button><button data-v="1">1</button><button data-v="2">2</button>
    </div>
    <a class="btn" id="icsBtn" href="schedule.ics">Добавить в Календарь iPhone</a>
    <button class="btn" id="closeSheet">Готово</button>
  </div></div>
</div>

<script>
/* ================= Утилиты времени ================= */
const DAY_KEYS = ['monday','tuesday','wednesday','thursday','friday','saturday'];
const DAY_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб'];
const DAY_FULL  = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAY_MS = 86400000;

// Для проверки можно открыть страницу с ?now=2026-09-29T10:00
const fakeNow = new URLSearchParams(location.search).get('now');
const now = () => fakeNow ? new Date(fakeNow) : new Date();

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => { const s = startOfDay(d); const wd = (s.getDay() + 6) % 7; return new Date(s - wd * DAY_MS); };
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const minsNow = () => { const n = now(); return n.getHours() * 60 + n.getMinutes(); };

// Номер недели (1 или 2): сколько недель прошло от опорной даты с сайта, по модулю 2
function weekNumber(date) {
  const anchorMon = mondayOf(new Date(DATA.anchor.date + 'T00:00'));
  const diff = Math.round((mondayOf(date) - anchorMon) / (7 * DAY_MS));
  return ((DATA.anchor.week - 1 + diff) % 2 + 2) % 2 + 1;
}

/* ================= Приведение данных ================= */
const SHORT = { 'Профессионально-прикладная физическая культура': 'Физкультура' };
function niceName(caps) {
  const s = caps.toLowerCase();
  const n = s.charAt(0).toUpperCase() + s.slice(1);
  return SHORT[n] || n;
}
const niceType = t => t === 'Лабораторная работа' ? 'Лаба' : t;
const subNum = s => (s.match(/\d/) || [''])[0];
const niceRoom = r => { const m = r.match(/корп\.\s*(\S+)\s*каб\.\s*(.+)/); return m ? `${m[1]}-${m[2]}` : r; };
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many;
}
const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)} ч ${m % 60 ? (m % 60) + ' мин' : ''}`.trim() : `${m} мин`;

/* ================= Состояние ================= */
let DATA = null;
let sub = 0;
try { sub = +(localStorage.getItem('sub') || 0); } catch (e) {}  // 0 = обе подгруппы
let weekOffset = 0;                              // 0 = текущая неделя, 1 = следующая …
let selDay = null;                               // индекс 0..5

// Пары на конкретную дату с учётом подгруппы
function lessonsFor(date) {
  const wd = (date.getDay() + 6) % 7;
  if (wd > 5) return [];
  const list = DATA.weeks[weekNumber(date)][DAY_KEYS[wd]] || [];
  return list.filter(l => !sub || !l.subgroup || subNum(l.subgroup) == sub);
}

/* ================= Карточка «Сейчас / Дальше» ================= */
function renderHero() {
  const el = document.getElementById('hero');
  const today = startOfDay(now()), m = minsNow();
  const todays = lessonsFor(today);
  const cur = todays.find(l => toMin(l.start) <= m && m < toMin(l.end));
  if (cur) {
    const left = toMin(cur.end) - m, total = toMin(cur.end) - toMin(cur.start);
    el.className = 'hero';
    el.innerHTML = `<div class="lbl">Сейчас идёт</div>
      <div class="name">${niceName(cur.name)}</div>
      <div class="meta">${niceType(cur.type)}, ${niceRoom(cur.room)}</div>
      <div class="big">${fmtDur(left)}<small>до конца, в ${cur.end}</small></div>
      <div class="bar"><i style="width:${(1 - left / total) * 100}%"></i></div>`;
    return;
  }
  // Ищем следующую пару: сегодня позже или в ближайшие 14 дней
  for (let i = 0; i < 15; i++) {
    const d = new Date(today.getTime() + i * DAY_MS);
    const next = lessonsFor(d).find(l => i > 0 || toMin(l.start) > m);
    if (!next) continue;
    let when;
    if (i === 0) when = `<div class="big">через ${fmtDur(toMin(next.start) - m)}<small>в ${next.start}</small></div>`;
    else when = `<div class="big">${i === 1 ? 'Завтра' : DAY_FULL[(d.getDay() + 6) % 7].replace(/^./, c => c.toUpperCase())}<small>в ${next.start}</small></div>`;
    el.className = i === 0 ? 'hero' : 'hero off';
    el.innerHTML = `<div class="lbl">${i === 0 && todays.some(l => toMin(l.end) <= m) ? 'Перерыв, дальше' : 'Следующая пара'}</div>
      <div class="name">${niceName(next.name)}</div>
      <div class="meta">${niceType(next.type)}, ${niceRoom(next.room)}</div>${when}`;
    return;
  }
  el.className = 'hero off';
  el.innerHTML = `<div class="lbl">Пар нет</div><div class="name">Отдыхай</div>`;
}

/* ================= Неделя и день ================= */
function renderWeek() {
  const mon = new Date(mondayOf(now()).getTime() + weekOffset * 7 * DAY_MS);
  const wn = weekNumber(mon);
  const rel = ['Эта неделя', 'Следующая', 'Через неделю'][weekOffset] || (weekOffset < 0 ? 'Прошлая' : `+${weekOffset} нед.`);
  document.getElementById('weekTitle').innerHTML = `${rel}<span>${wn} неделя</span>`;

  const today = startOfDay(now()).getTime();
  const box = document.getElementById('days');
  box.innerHTML = '';
  DAY_SHORT.forEach((name, i) => {
    const d = new Date(mon.getTime() + i * DAY_MS);
    const n = lessonsFor(d).length;
    const b = document.createElement('button');
    b.className = 'day' + (d.getTime() === today ? ' today' : '') + (i === selDay ? ' sel' : '') + (n ? '' : ' empty');
    b.innerHTML = `<em>${name}</em><b>${d.getDate()}</b><div class="dots">${'<i></i>'.repeat(Math.min(n, 5))}</div>`;
    b.onclick = () => { selDay = i; render(); };
    box.appendChild(b);
  });
  renderDay(new Date(mon.getTime() + selDay * DAY_MS));
}

function renderDay(date) {
  const list = document.getElementById('list');
  const ls = lessonsFor(date);
  const isToday = date.getTime() === startOfDay(now()).getTime();
  const m = minsNow();
  if (!ls.length) {
    list.innerHTML = `<div class="none"><b>Пар нет</b>${DAY_FULL[(date.getDay() + 6) % 7]}, ${date.getDate()} ${MONTHS[date.getMonth()]}</div>`;
    return;
  }
  let html = '';
  ls.forEach((l, i) => {
    if (i > 0) {
      const gap = toMin(l.start) - toMin(ls[i - 1].end);
      if (gap > 30) html += `<div class="gap">окно ${fmtDur(gap)}</div>`;
    }
    const state = isToday ? (m >= toMin(l.end) ? ' past' : m >= toMin(l.start) ? ' now' : '') : '';
    const map = l.address ? `https://yandex.ru/maps/?text=${encodeURIComponent('Красноярск, ' + l.address)}` : null;
    const t = niceType(l.type);
    html += `<article class="les${state}">
      <div class="t">${l.start}<span>${l.end}</span><i>${i + 1} ПАРА</i></div>
      <div>
        <h3>${niceName(l.name)}</h3>
        <div class="tags"><span class="tag ${t}">${t}</span>${l.subgroup ? `<span class="tag">${subNum(l.subgroup)} подгр.</span>` : ''}</div>
        <div class="room">📍 ${map ? `<a href="${map}" target="_blank" rel="noopener">${niceRoom(l.room)}</a>` : niceRoom(l.room)}</div>
        <div class="who">${l.teacher}</div>
      </div>
    </article>`;
  });
  list.innerHTML = html;
}

function render() {
  const n = now();
  document.getElementById('todayLine').textContent =
    `${DAY_FULL[(n.getDay() + 6) % 7].replace(/^./, c => c.toUpperCase())}, ${n.getDate()} ${MONTHS[n.getMonth()]}`;
  renderHero();
  renderWeek();
}

/* ================= Настройки ================= */
const root = document.getElementById('sheetRoot');
const openSheet = v => root.classList.toggle('open', v);
document.getElementById('gear').onclick = () => openSheet(true);
document.getElementById('sheetBg').onclick = document.getElementById('closeSheet').onclick = () => openSheet(false);
function paintSeg() { document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', +b.dataset.v === sub)); }
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  sub = +b.dataset.v; try { localStorage.setItem('sub', sub); } catch (e) {} paintSeg(); render();
});
// webcal:// — iPhone не импортирует пары один раз, а подписывается на календарь,
// и когда расписание на сайте обновится, Календарь сам подтянет изменения
function paintIcs() {
  const file = `schedule${sub ? '-' + sub : ''}.ics`;
  const url = new URL(file, location.href);
  document.getElementById('icsBtn').href = url.protocol === 'https:' ? 'webcal://' + url.host + url.pathname : file;
}
paintIcs();
document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', paintIcs));

document.getElementById('prev').onclick = () => { weekOffset--; render(); };
document.getElementById('next').onclick = () => { weekOffset++; render(); };

// Свайп влево/вправо по списку листает дни
let sx = null;
document.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) < 60 || root.classList.contains('open')) return;
  selDay += dx < 0 ? 1 : -1;
  if (selDay > 5) { selDay = 0; weekOffset++; }
  if (selDay < 0) { selDay = 5; weekOffset--; }
  render();
});

/* ================= Старт ================= */
async function start() {
  DATA = await (await fetch('data.json', { cache: 'no-cache' })).json();
  document.getElementById('group').textContent = DATA.group;
  document.getElementById('foot').textContent = `Данные с сайта СибГУ от ${DATA.updated.split('-').reverse().join('.')}`;
  const wd = (now().getDay() + 6) % 7;
  if (wd === 6) { weekOffset = 1; selDay = 0; } else selDay = wd;  // в воскресенье сразу показываем понедельник
  paintSeg();
  render();
  setInterval(renderHero, 30000);  // таймер «до конца пары» тикает сам
  // iPhone держит приложение в памяти: при возврате к нему перескакиваем на сегодня
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const d = (now().getDay() + 6) % 7;
    weekOffset = d === 6 ? 1 : 0; selDay = d === 6 ? 0 : d; render();
  });
}
start();

// Service worker: чтобы приложение открывалось без интернета
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
