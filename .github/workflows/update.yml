name: Обновить расписание

on:
  workflow_dispatch:
  push:
    paths: ["page.html"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python parse.py page.html data.json
      - name: Сохранить, если что-то поменялось
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json schedule*.ics
          git diff --cached --quiet || (git commit -m "Обновил расписание" && git push)
