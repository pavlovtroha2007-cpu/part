# Автообновление: каждый день в 06:00 по Красноярску GitHub сам скачивает расписание.
# Если сайт СибГУ не пускает серверы GitHub (они за рубежом), шаг упадёт — тогда обновляем через ./update.sh с Мака
name: Обновить расписание

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 06:00 Красноярск
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Скачать страницу группы
        run: curl -sSL --max-time 30 -A "Mozilla/5.0" https://timetable.pallada.sibsau.ru/timetable/group/14344 -o page.html
      - run: python parse.py page.html data.json
      - name: Закоммитить, если что-то поменялось
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json schedule*.ics
          git diff --cached --quiet || (git commit -m "Автообновление расписания" && git push)
